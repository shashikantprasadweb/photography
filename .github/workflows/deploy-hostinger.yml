name: Deploy Hub and Photography to Hostinger

# Code only. Photos and videos are never in Git; they are uploaded directly
# with scripts/deploy-media.sh. The Travel spoke has its own repo/workflow.
# server-dir is relative to the FTP root (= public_html), as proven by the
# Travel workflow history ("adjust FTP target directory relative to public_html").

on:
  push:
    branches:
      - staging
      - main

jobs:
  web-deploy:
    name: Deploy to Hostinger
    runs-on: ubuntu-latest
    steps:
      - name: Get latest code
        uses: actions/checkout@v4

      - name: Deploy Staging
        if: github.ref == 'refs/heads/staging'
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          security: loose
          server-dir: staging/
          state-name: .ftp-deploy-sync-hub-staging-v2.json
          exclude: |
            **/.git*
            **/.git*/**
            **/travel/**
            **/travel-blog/**
            README.md

      - name: Deploy Production
        if: github.ref == 'refs/heads/main'
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          security: loose
          server-dir: ./
          state-name: .ftp-deploy-sync-hub-live-v2.json
          exclude: |
            **/.git*
            **/.git*/**
            **/travel/**
            **/travel-blog/**
            README.md
