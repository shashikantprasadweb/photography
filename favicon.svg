<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <linearGradient id="lensGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
  </defs>
  <!-- Background Badge (rounded squircle) -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="#07090e" stroke="rgba(255,255,255,0.12)" stroke-width="1.5"/>
  <!-- Camera Body -->
  <rect x="9" y="19" width="46" height="33" rx="6" fill="#0f172a" stroke="url(#brandGrad)" stroke-width="2"/>
  <!-- Viewfinder Pentaprism -->
  <path d="M24 19 L27 13 L37 13 L40 19 Z" fill="#0f172a" stroke="url(#brandGrad)" stroke-width="2" stroke-linejoin="round"/>
  <!-- Shutter Button -->
  <rect x="13" y="14" width="6" height="3" rx="1.5" fill="#f59e0b"/>
  <!-- Flash / Sensor Dot -->
  <circle cx="48" cy="25" r="2" fill="#10b981"/>
  <!-- Central Lens Outer Ring -->
  <circle cx="32" cy="35.5" r="12.5" fill="#07090e" stroke="url(#brandGrad)" stroke-width="2"/>
  <!-- Lens Inner Ring -->
  <circle cx="32" cy="35.5" r="9.5" fill="none" stroke="url(#lensGrad)" stroke-width="1" stroke-dasharray="3, 1.5"/>
  <!-- Monogram SP (Crisp Modern Vector Text) -->
  <text x="32" y="39.5" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="900" fill="#ffffff" letter-spacing="0.5">SP</text>
</svg>